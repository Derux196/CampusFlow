

app.jwt.secret=${JWT_SECRET}
spring.application.name=campusflow
spring.jpa.open-in-view=false
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Stripe - Clase 15
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_pendiente}

stripe.price-pago-unico=${STRIPE_PRICE_PAGO_UNICO}
stripe.price-plan-individual=${STRIPE_PRICE_PLAN_INDIVIDUAL}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:${server.port}}
stripe.url-exito=${app.public-base-url}/pago-exitoso.html
stripe.url-cancelado=${app.public-base-url}/pago-cancelado.html